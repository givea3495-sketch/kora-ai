<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kora AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">K</span>
            <span>Kora AI</span>
        </div>

        <button class="menu-btn">☰</button>
    </header>

    <main class="main">

        <section class="hero">
            <p class="greeting">Hello 👋🏾</p>

            <h1>
                What can I help<br>
                you with today?
            </h1>

            <p class="subtitle">
                Intelligence for Africa. Built for the world.
            </p>
        </section>

        <section class="tools">

            <div class="tool-card">
                <span>🤖</span>
                <h3>Kora Assistant</h3>
                <p>Ask anything</p>
            </div>

            <div class="tool-card" id="learnCard">
                <span>🎓</span>
                <h3>Kora Learn</h3>
                <p>Learn anything</p>
            </div>

            <div class="tool-card">
                <span>💼</span>
                <h3>Kora Business</h3>
                <p>Grow your business</p>
            </div>

            <div class="tool-card">
                <span>🌍</span>
                <h3>Translate</h3>
                <p>Many languages</p>
            </div>

        </section>

        <section class="chat-box">

            <input
                type="text"
                id="userInput"
                placeholder="Ask Kora anything..."
            >

            <button id="sendBtn">➤</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
